# `trunk build` bundles the app into dist/ (`--release` for an optimized build);
# `trunk serve` is the development server the Tauri shell loads (`cargo tauri dev`).
[build]
target = "index.html"
dist = "dist"

# The styles: Tailwind CSS (`tailwind.css`), built by the standalone CLI that Trunk downloads
# (no Node.js step). Pinned: a new version may change the generated CSS.
[tools]
tailwindcss = "4.3.3"

[watch]
ignore = ["src-tauri"]

[serve]
addresses = ["127.0.0.1"]
port = 1420
open = false
