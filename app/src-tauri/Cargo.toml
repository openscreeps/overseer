[package]
name = "overseer-app-tauri"
description = "Desktop shell of the Overseer app: Tauri 2 webview, in-process overseer-proxy and OS keychain"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# Not `overseer`: that is the binary of the command-line tool (`crates/overseer-cli`).
[[bin]]
name = "overseer-ui"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
overseer-core.workspace = true
overseer-proxy.workspace = true
# The profiles file that the CLI shares (the `profiles_*` commands) and the secrets in the OS
# credential store (the `secret_*` commands).
overseer-storage.workspace = true
serde.workspace = true
tauri.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-window-state.workspace = true
tokio = { workspace = true, features = ["sync"] }
url.workspace = true

[lints]
workspace = true
