[workspace]
resolver = "3"
members = ["crates/*", "web/demo", "xtask", "app", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
overseer-core = { path = "crates/overseer-core" }
overseer-net = { path = "crates/overseer-net" }
overseer = { path = "crates/overseer" }
overseer-view = { path = "crates/overseer-view" }
overseer-proxy = { path = "crates/overseer-proxy" }
overseer-storage = { path = "crates/overseer-storage" }
async-tungstenite = { version = "0.32", features = ["tokio-runtime"] }
base64 = "0.23"
bytemuck = { version = "1.25", features = ["derive"] }
flate2 = "1.1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
glam = { version = "0.34", default-features = false, features = ["std"] }
http = "1.5"
percent-encoding = "2.3"
# rustls with the ring provider (installed by overseer-net), not reqwest's default aws-lc-rs:
# aws-lc needs cmake and a C toolchain per target, which complicates mobile cross-compiles.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "charset", "system-proxy"] }
reqwest-websocket = "0.6"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = "1"
url = "2.5"
# Browser (wasm32) runtime: timers on `setTimeout`, tasks on the browser's event loop.
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4"
wasmtimer = { version = "0.4", default-features = false, features = ["tokio"] }
web-sys = "0.3"
# The Overseer app (app/): Leptos UI in the browser or webview, Tauri desktop shell.
console_error_panic_hook = "0.1"
# Class sets of the app's Tailwind styling, composed at compile time (`concatcp!`).
const_format = "0.2"
js-sys = "0.3"
leptos = { version = "0.8", features = ["csr"] }
tauri = { version = "2.12", features = [] }
tauri-build = { version = "2.5", features = [] }
tauri-plugin-opener = "2.7"
tauri-plugin-window-state = "2.5"
# Room renderer: WebGPU and WebGL2 in browsers, no native backend (see overseer-view).
wgpu = { version = "30.0.1", default-features = false, features = ["std", "wgsl"] }
# overseer-storage: the configuration directory (the one of Tauri's `app_config_dir`, which
# `dirs` 7 resolves too) and secrets in the OS credential store.
dirs = "7"
keyring = "3.6"
# overseer-proxy: HTTP server, static files, logs and the binary's command line.
clap = "4.6"
http-body-util = "0.1"
hyper = "1.12"
hyper-util = "0.1.21"
tokio-util = "0.7"
tower = "0.5"
tower-http = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false }
# xtask: `cargo xtask e2e` stops its disposable server on Ctrl-C and SIGTERM.
ctrlc = { version = "3.5", features = ["termination"] }
# overseer-cli: the configuration file and its `--env-file` secrets.
dotenvy = "0.15"
toml = { version = "1", default-features = false }
# overseer-cli: `overseer login` reads a token or a password from the terminal without echo.
rpassword = "7.5"

[workspace.lints.rust]
warnings = { level = "deny", priority = -2 }
unused = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }
missing_docs = "deny"
unsafe_code = "deny"

[workspace.lints.clippy]
allow_attributes = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"
# Modules live in `foo.rs` with their children in `foo/`, never in
# `foo/mod.rs` (the Rust Reference's recommended layout); integration test
# crates with several files use `tests/<name>/main.rs`.
mod_module_files = "deny"

[workspace.lints.rustdoc]
all = { level = "warn", priority = -1 }
