[tasks.fmt]
description = "Verify the workspace is rustfmt-clean"
run = "cargo fmt --all -- --check"

[tasks.codegen]
description = "Generated HTTP and socket API code matches reference/ (refresh with `cargo xtask codegen`)"
run = "cargo xtask codegen --check"

[tasks.check]
description = "Clippy gate: pedantic, warnings are errors"
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.test]
description = "Workspace test suite"
run = "cargo test --workspace"

[tasks.portable]
description = "overseer-core stays sans-I/O, and the client stack, room viewer and web demo build for browsers (wasm32)"
run = [
  "cargo check -p overseer-core --target wasm32-unknown-unknown",
  "cargo clippy -p overseer-net -p overseer -p overseer-web-demo -p overseer-view -p overseer-app --target wasm32-unknown-unknown -- -D warnings",
]

[tasks.web-demo]
description = "Build the browser demo bundle into target/web-demo/ (serve it over HTTP)"
run = "cargo xtask web-demo"

[tasks.web-demo-proxy]
description = "Serve the browser demo same-origin through overseer-proxy, fronting screeps.com (http://127.0.0.1:8080/)"
depends = ["web-demo"]
run = "cargo run -p overseer-proxy -- --upstream https://screeps.com/ --static target/web-demo"

[tasks.app-web]
description = "Build the Overseer app for the web into app/dist/ (trunk; serve it, e.g. with overseer-proxy --static app/dist)"
dir = "app"
run = "trunk build --release"

[tasks.app-dev]
description = "Run the Overseer desktop app with the trunk dev server (cargo tauri dev)"
dir = "app/src-tauri"
run = "cargo tauri dev"

[tasks.app-build]
description = "Build the Overseer desktop app and its installers (cargo tauri build)"
dir = "app/src-tauri"
run = "cargo tauri build"

[tasks.e2e]
description = "Live feature tests and Playwright UI tests against a disposable OpenScreeps world from ../server (or $OPENSCREEPS_SERVER_DIR); --rust-only, --ui-only, --no-build"
run = "cargo xtask e2e"

[tasks.ci]
description = "Everything CI runs, in order"
depends = ["fmt", "codegen", "check", "test", "portable"]
