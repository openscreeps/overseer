[package]
name = "overseer"
description = "Screeps client application layer on overseer-net: session, live rooms, console and every non-UI feature of the official client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
base64.workspace = true
overseer-net.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# `rt` for the blocking file work of code directory sync.
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Browsers: tasks and timers come from `overseer_net::rt`.
tokio = { workspace = true, features = ["macros", "sync"] }

[dev-dependencies]
async-tungstenite.workspace = true
# Gzip-encoded Memory replies of the in-process server.
flate2.workspace = true
# `test-util` pauses time for the token refresh tests.
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "sync", "test-util", "time"] }

[lints]
workspace = true
