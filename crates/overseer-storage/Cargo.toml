[package]
name = "overseer-storage"
description = "Saved Screeps servers, sign-ins and secrets of Overseer, shared by the app, its desktop shell and the CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
# `web`: the browser storage of the app (`localStorage`).
web = ["dep:js-sys", "dep:wasm-bindgen", "dep:web-sys"]

[dependencies]
# `ServerUrl`: the normalized base URL of a saved server; `ServerKind`: the contract to force.
overseer-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
js-sys = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = ["Storage", "Window"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dirs.workspace = true
keyring.workspace = true

# Secrets in the OS store: Windows Credential Manager, macOS Keychain, the Secret Service on
# Linux.
[target.'cfg(windows)'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, features = ["sync-secret-service", "crypto-rust"] }

[lints]
workspace = true
