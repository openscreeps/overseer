[package]
name = "overseer-net"
description = "Async Screeps client on overseer-core: HTTP, socket, rate limits and client flows over reqwest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
overseer-core.workspace = true
futures-util.workspace = true
http.workspace = true
# Official room-history files are served with `Content-Encoding: gzip`.
reqwest = { workspace = true, features = ["gzip"] }
reqwest-websocket.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Encodes the token prefix in screeps.com's rate-limit reset page (`Api::rate_limit_lift`);
# already a dependency of reqwest.
url.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Tells a connection lost before the socket upgrade's response from other send errors (see
# `Client::connect`); already a dependency of reqwest.
hyper.workspace = true
# The crypto provider for reqwest's rustls (see `ClientBuilder::build`).
rustls.workspace = true
# `rt` for `rt::spawn`, `time` for the timers of `rt`.
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Browsers: no tokio runtime; tasks run on the browser's event loop and timers on
# `setTimeout` (see `rt`).
tokio = { workspace = true, features = ["macros", "sync"] }
wasm-bindgen-futures.workspace = true
wasmtimer.workspace = true

[dev-dependencies]
async-tungstenite.workspace = true
flate2.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
